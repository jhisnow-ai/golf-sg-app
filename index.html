<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Golf SG</title>
  <link rel="manifest" href="/golf-sg-app/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Golf SG">
  <meta name="theme-color" content="#1a3a2a">
  <link rel="apple-touch-icon" href="/golf-sg-app/icons/icon-192.png">
  <link rel="stylesheet" href="/golf-sg-app/css/app.css">
</head>
<body>

  <!-- ── SCREEN 1: Home ───────────────────────────────────────────────── -->
  <div id="home-screen" class="screen active">
    <div class="logo">
      <h1>Golf SG</h1>
      <p>Strokes Gained tracker</p>
    </div>
    <div class="actions">
      <button id="new-round-btn"      class="btn btn-primary">⛳ New Round</button>
      <button id="manage-courses-btn" class="btn btn-outline">Manage Courses</button>
    </div>
    <div class="content">
      <div class="rounds-section">
        <h2>Recent Rounds</h2>
        <div id="rounds-list"></div>
      </div>
    </div>
  </div>

  <!-- ── SCREEN 2: Course Select ──────────────────────────────────────── -->
  <div id="course-screen" class="screen">
    <div class="header">
      <button id="back-to-home-from-course" class="back-btn">‹</button>
      <h1>Select Course</h1>
    </div>
    <div class="content">
      <div id="course-list"></div>
    </div>
  </div>

  <!-- ── SCREEN 3: Tee Select ─────────────────────────────────────────── -->
  <div id="tee-screen" class="screen">
    <div class="header">
      <button id="back-from-tee" class="back-btn">‹</button>
      <h1 id="tee-course-name">Select Tee</h1>
    </div>
    <div class="content">
      <div id="tee-list"></div>
    </div>
  </div>

  <!-- ── SCREEN 4: Scorecard ──────────────────────────────────────────── -->
  <div id="scorecard-screen" class="screen">
    <div class="header">
      <button id="back-to-home-from-card" class="back-btn">‹</button>
      <div style="flex:1">
        <h1 id="card-course-name">—</h1>
        <div style="font-size:0.75rem;color:var(--text-muted)" id="card-date"></div>
      </div>
    </div>
    <div class="content">
      <div class="scorecard-summary">
        <div>
          <div class="ss-label">Total</div>
          <div class="ss-value" id="card-total-score">—</div>
        </div>
        <div style="text-align:center">
          <div class="ss-label">vs Par</div>
          <div class="ss-value" id="card-rel-score">—</div>
        </div>
        <div style="text-align:right">
          <div class="ss-label">Holes</div>
          <div class="ss-value" id="card-holes-played">0/18</div>
        </div>
      </div>
      <div id="holes-list"></div>
    </div>
  </div>

  <!-- ── SCREEN 5: Manage Courses (list) ──────────────────────────────── -->
  <div id="editor-list-screen" class="screen">
    <div class="header">
      <button id="back-from-editor-list" class="back-btn">‹</button>
      <h1>Manage Courses</h1>
    </div>
    <div class="content">
      <div id="editor-course-list"></div>
      <button id="add-course-btn" class="btn btn-outline" style="margin-top:8px">+ Add New Course</button>
    </div>
  </div>

  <!-- ── SCREEN 6: Course Editor ──────────────────────────────────────── -->
  <div id="course-editor-screen" class="screen">
    <div class="header">
      <button id="back-from-editor" class="back-btn">‹</button>
      <h1 id="editor-title">Edit Course</h1>
      <button id="save-course-btn" class="btn btn-primary btn-sm">Save</button>
    </div>
    <div class="content">

      <!-- Name & location -->
      <div class="editor-section">
        <div class="input-row">
          <label>Course name</label>
          <input type="text" id="editor-name-input" placeholder="e.g. Te Puke Golf Club"
                 autocomplete="off" autocorrect="off" spellcheck="false">
        </div>
        <div class="input-row">
          <label>Location</label>
          <input type="text" id="editor-loc-input" placeholder="Town, Region"
                 autocomplete="off" autocorrect="off" spellcheck="false">
        </div>
      </div>

      <!-- Tees -->
      <div class="section-heading">Tees</div>
      <div id="editor-tees-list"></div>
      <button id="add-tee-btn" class="btn btn-outline btn-sm" style="margin-bottom:20px">+ Add Tee</button>

      <!-- Holes — tap a row to edit par, SI, and per-tee distances -->
      <div class="section-heading">
        Holes
        <span style="font-weight:400;font-size:0.75rem;color:var(--text-muted)"> — tap to edit</span>
      </div>
      <div id="editor-holes-list"></div>

    </div>
  </div>

  <!-- ── MODAL: Scoring (hole entry during a round) ───────────────────── -->
  <div id="hole-modal" class="modal-overlay">
    <div class="modal-sheet">
      <h2 id="modal-title">Hole — Par —</h2>
      <div class="field-row">
        <label>Score</label>
        <div class="stepper">
          <button id="score-dec">−</button>
          <div class="step-val" id="score-val">4</div>
          <button id="score-inc">+</button>
        </div>
      </div>
      <div class="field-row">
        <label>Putts</label>
        <div class="stepper">
          <button id="putts-dec">−</button>
          <div class="step-val" id="putts-val">2</div>
          <button id="putts-inc">+</button>
        </div>
      </div>
      <div class="toggle-row" id="fir-row">
        <label>Fairway hit?</label>
        <div class="toggle-group">
          <button class="toggle-btn" id="fir-yes">Yes</button>
          <button class="toggle-btn" id="fir-no">No</button>
        </div>
      </div>
      <div class="toggle-row">
        <label>GIR?</label>
        <div class="toggle-group">
          <button class="toggle-btn" id="gir-yes">Yes</button>
          <button class="toggle-btn" id="gir-no">No</button>
        </div>
      </div>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn btn-outline">Cancel</button>
        <button id="modal-save"   class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>

  <!-- ── MODAL: Tee Editor (add / edit a tee on a course) ─────────────── -->
  <div id="tee-edit-modal" class="modal-overlay">
    <div class="modal-sheet">
      <h2 id="tee-modal-title">Add Tee</h2>
      <div class="input-row">
        <label>Name</label>
        <input type="text" id="tee-name-input" placeholder="e.g. Blue" autocomplete="off">
      </div>
      <div class="input-row">
        <label>Course Rating</label>
        <input type="number" id="tee-rating-input" placeholder="e.g. 71.2"
               step="0.1" min="50" max="80" inputmode="decimal">
      </div>
      <div class="input-row">
        <label>Slope</label>
        <input type="number" id="tee-slope-input" placeholder="e.g. 128"
               step="1" min="55" max="155" inputmode="numeric">
      </div>
      <div class="modal-actions">
        <button id="tee-modal-cancel" class="btn btn-outline">Cancel</button>
        <button id="tee-modal-save"   class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>

  <!-- ── MODAL: Hole Editor (par / SI / distances within course editor) ── -->
  <div id="hole-editor-modal" class="modal-overlay">
    <div class="modal-sheet">
      <h2 id="he-title">Hole —</h2>
      <div class="field-row">
        <label>Par</label>
        <div class="stepper">
          <button id="he-par-dec">−</button>
          <div class="step-val" id="he-par-val">4</div>
          <button id="he-par-inc">+</button>
        </div>
      </div>
      <div class="field-row">
        <label>Stroke Index</label>
        <div class="stepper">
          <button id="he-si-dec">−</button>
          <div class="step-val" id="he-si-val">1</div>
          <button id="he-si-inc">+</button>
        </div>
      </div>
      <!-- Per-tee distance inputs injected here by app.js -->
      <div id="he-tee-distances"></div>
      <div class="modal-actions" style="margin-top:20px">
        <button id="he-cancel" class="btn btn-outline">Cancel</button>
        <button id="he-save"   class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.min.js"></script>
  <script src="/golf-sg-app/js/db.js"></script>
  <script src="/golf-sg-app/js/app.js"></script>
</body>
</html>
